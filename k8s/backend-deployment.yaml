apiVersion: apps/v1
kind: Deployment
metadata:
 name: backend-deployment
 namespace: data
spec:
 replicas: 2
 selector:
  matchLabels:
   app: backend
 template:
   metadata:
    labels:
     app: backend
   spec:
    containers:
     - name: backend-cont
       image: yashdubey455/api:latest
       ports:
        - containerPort: 8000
       envFrom:
        - secretRef:
           name: db-secret
       resources:
        limits:
         memory: "512Mi"
         cpu: "500m"
        requests:
         memory: "256Mi"
         cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
 name: backend-service
 namespace: data
spec:
 selector:
  app: backend
 ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
 type: ClusterIP
    