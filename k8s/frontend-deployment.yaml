apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: data
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend-cont
          image: yashdubey455/ui:6
          ports:
            - containerPort: 3000
          resources:
            limits:
             memory: "512Mi"
             cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
             path: /
             port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          
          readinessProbe:
            httpGet:
             path: /
             port: 3000
            initialDelaySeconds: 15
            periodSeconds: 5
---

apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: data
spec:
  selector:
    app: frontend
  ports:
   - protocol: TCP
     port: 3000
     targetPort: 3000
  type: ClusterIP
              