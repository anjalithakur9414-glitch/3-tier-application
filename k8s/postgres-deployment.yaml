apiVersion: apps/v1
kind: Deployment
metadata:
 name: postgres-deployment
 namespace: data
spec:
 replicas: 1
 selector:
  matchLabels:
   app: postgres
 template:
  metadata:
   labels:
    app: postgres
  spec:
    containers:
      - name: postgres-cont
        image: postgres:15
        ports:
         - containerPort: 5432
        envfrom:
         - secretRef:
            name: db-secret
        resources:
         limits:
          memory: "512Mi"
          cpu: "500m"
         requests:
          memory: "256Mi"
          cpu: "250m"


---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: data
spec:
  selector:
    app: postgres
  type:  ClusterIP
  ports:
   -  protocol: TCP
      port: 5432
      targetPort: 5432
